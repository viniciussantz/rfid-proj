services:
  db:
    image: postgres:16-alpine
    container_name: rfid_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rfid}
      POSTGRES_USER: ${POSTGRES_USER:-rfid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rfid}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rfid} -d ${POSTGRES_DB:-rfid}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rfid_web
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      POSTGRES_DB: ${POSTGRES_DB:-rfid}
      POSTGRES_USER: ${POSTGRES_USER:-rfid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rfid}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["bash", "./entrypoint.sh"]

volumes:
  pgdata:
